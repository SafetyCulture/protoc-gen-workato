---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
      exclude:
        - "sc-go.io/*"
        - "github.com/SafetyCulture/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "[INTG-1601]"
    cooldown:
      default-days: 7
      exclude:
        - "SafetyCulture/*"
